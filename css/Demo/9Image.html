<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image CSS Examples</title>
  </head>
  <body>
    <!-- Image with dashed red border
    boarder type - 
    dashed - is a series of short line segments, 
    dotted - is a series of round dots, 
    solid - is a single solid line, 
    double - is two solid lines, 
    groove - is a sunken appearance, 
    ridge - is a raised appearance, 
    inset - is a sunken appearance, 
    outset - is a raised appearance 
    -->
    <img style="border: 5px dashed red" src="image.png" alt="Image Example" />
  </body>
</html>
