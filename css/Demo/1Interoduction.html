<!-- CSS Introduction
- CSS (Cascading Style Sheets) is a stylesheet language 
used to describe the presentation of a document written in HTML or XML. 
It allows you to control the layout, colors, fonts, and overall appearance of web pages.
CSS works by associating rules with HTML elements, which can be applied to multiple elements 
across a website, making it easier to maintain and update the design.

Advantages of CSS:
1. Save Time, Page loads faster
2. Easy Maintenance
3. Superior Styles to HTML
4. Mobile device compatibility
5. Accessibility
