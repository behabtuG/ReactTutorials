<!-- CSS Inclusion
    CSS can be included in three ways:
    1. Inline CSS: Using the style attribute within HTML elements.
    2. Internal(embedded CSS): Using the <style> tag within the <head> section of the HTML document.
    3.External CSS: Linking to an external CSS file using the <link> tag in the <head> section of the HTML document.
    3. Linking  to an external CSS file: Using the <link> tag in the <head> section of the HTML document.
    4.Importing CSS: Using the @import rule within a <style> tag or an external CSS file to import
